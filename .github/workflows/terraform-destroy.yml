name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type DESTROY to confirm'
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-workload
  cancel-in-progress: false

env:
  ARM_USE_OIDC: true
  ARM_USE_AZUREAD: true
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
  TF_VAR_vm_admin_principal_id: ${{ vars.VM_ADMIN_PRINCIPAL_ID }}

jobs:
  destroy:
    name: Destroy Workload
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Validate confirmation
        shell: bash
        run: |
          if [ "${{ inputs.confirmation }}" != "DESTROY" ]; then
            echo "Confirmation must be exactly DESTROY."
            exit 1
          fi

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform init
        working-directory: workload
        run: terraform init -input=false

      - name: Terraform validate
        working-directory: workload
        run: terraform validate

      - name: Create destroy plan
        working-directory: workload
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Show destroy plan
        working-directory: workload
        run: terraform show -no-color destroy.tfplan

      - name: Apply destroy plan
        working-directory: workload
        run: terraform apply -input=false destroy.tfplan
